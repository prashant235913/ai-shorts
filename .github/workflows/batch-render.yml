name: Batch Render

# Renders every script in queue/ at once (in parallel) and publishes each as a release.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.l.outputs.files }}
    steps:
      - uses: actions/checkout@v4
      - id: l
        run: echo "files=$(ls queue/*.json | python3 -c 'import sys,json;print(json.dumps(sys.stdin.read().split()))')" >> "$GITHUB_OUTPUT"

  render:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        file: ${{ fromJson(needs.list.outputs.files) }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "edge-tts>=7" requests
      - name: Render
        env:
          SCRIPT: ${{ matrix.file }}
        run: python render.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          slug=$(basename "${{ matrix.file }}" .json)
          gh release create "short-$slug" out/final.mp4 out/thumb.jpg \
            --title "$(cat out/title.txt)" --notes-file out/upload.txt

  finish:
    needs: render
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move rendered scripts to done/
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in queue/*.json; do
            slug=$(basename "$f" .json)
            if gh release view "short-$slug" >/dev/null 2>&1; then git mv "$f" done/; fi
          done
          git config user.name "ai-shorts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Batch rendered" || exit 0
          git push
